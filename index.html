<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sky Tonight — Observation Planner</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="app-header">
        <h1>Sky Tonight</h1>
        <form id="search-form" class="search-form" role="search">
            <input id="search-input" type="text" placeholder="Search by catalog ID or name (e.g. M31, Andromeda Galaxy)" aria-label="Search objects">
            <button type="submit">Search</button>
        </form>
        <div class="planner-controls">
            <label for="date-input">Date
                <input id="date-input" type="date">
            </label>
            <label for="location-input">Location
                <input id="location-input" type="text" placeholder="City or lat,lon">
            </label>
            <span id="location-status" class="location-status" aria-live="polite"></span>
        </div>
        <div class="font-size-controls" role="group" aria-label="Text size">
            <button id="font-size-decrease" type="button" aria-label="Decrease text size">A-</button>
            <button id="font-size-increase" type="button" aria-label="Increase text size">A+</button>
        </div>
        <a class="how-to-link" href="howto.html">How To</a>
    </header>

    <div class="app-body">
        <nav class="tabs" aria-label="View selector">
            <button class="tab is-active" data-tab="results">Results</button>
            <button class="tab" data-tab="saved">Saved Objects</button>
            <button class="tab" data-tab="plan">Plan</button>
        </nav>

        <div id="filters-bar" class="filters" aria-label="Filter results">
            <label for="dataset-filter">Catalog
                <select id="dataset-filter">
                    <option value="messier">Messier objects</option>
                    <option value="deepSky">All deep-sky objects</option>
                    <option value="solarSystem">Solar System</option>
                </select>
            </label>
            <label for="type-filter">Type
                <select id="type-filter">
                    <!-- populated by js/app.js from js/typeLabels.js, per selected catalog -->
                </select>
            </label>
            <label for="magnitude-filter">Brighter than
                <input id="magnitude-filter" type="number" step="0.1" placeholder="mag">
            </label>
            <label class="filters__checkbox">
                <input id="visible-filter" type="checkbox">
                Visible now
            </label>
            <label for="altitude-filter">Peaks above
                <input id="altitude-filter" type="number" step="1" min="0" max="90" placeholder="°">
            </label>
            <label for="apex-start-filter">Apex between
                <input id="apex-start-filter" type="time">
            </label>
            <label for="apex-end-filter">and
                <input id="apex-end-filter" type="time">
            </label>
            <label for="window-start-filter">Up between
                <input id="window-start-filter" type="time">
            </label>
            <label for="window-end-filter">and
                <input id="window-end-filter" type="time">
            </label>
            <label for="window-altitude-filter" title="Only usable alongside the &quot;Up between&quot; window above - finds objects above this altitude at some point in that window, not just at their daily peak.">Altitude above
                <input id="window-altitude-filter" type="number" step="1" min="0" max="90" placeholder="°" disabled>
            </label>
            <button id="clear-filters" type="button">Clear filters</button>
        </div>

        <div class="results-column">
            <main id="results" class="object-grid" aria-live="polite">
                <!-- object cards rendered here by js/render.js -->
            </main>

            <div id="saved-list-toolbar" class="saved-list-toolbar" hidden>
                <label for="favorites-sort">Sort by
                    <select id="favorites-sort">
                        <option value="rise">Rise time</option>
                        <option value="transit">Apex time</option>
                        <option value="set">Set time</option>
                        <option value="duration">Transit duration</option>
                    </select>
                </label>
                <div id="favorites-dome-control" class="dome-control" hidden>
                    <button id="favorites-dome-add" type="button" class="dome-button">Add all to dome</button>
                    <button id="favorites-dome-reset" type="button" class="dome-button dome-button--secondary">Reset dome view</button>
                    <span id="favorites-dome-status" class="dome-control__status" aria-live="polite"></span>
                </div>
            </div>

            <section id="saved-list" class="saved-list" hidden aria-label="Saved objects">
                <!-- favorited objects rendered here by js/render.js -->
            </section>

            <section id="plan-list" class="plan-list" hidden aria-label="Tonight's observing plan">
                <!-- favorites visible on the selected date, in viewing order, rendered here by js/render.js -->
            </section>

            <nav id="pagination" class="pagination" aria-label="Result pages" hidden>
                <button id="prev-page" type="button">&lt; Prev</button>
                <span id="page-info"></span>
                <button id="next-page" type="button">Next &gt;</button>
            </nav>
        </div>

        <aside id="detail-panel" class="detail-panel" aria-live="polite">
            <!-- selected object detail rendered here by js/render.js -->
        </aside>
    </div>

    <script type="module" src="js/app.js"></script>
</body>
</html>
